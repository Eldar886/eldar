<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin İdarəetmə Paneli</title>
    
    <!-- TƏHLÜKƏSİZLİK QORUMASI: Şifrə yazmadan girməyə çalışsalar, loginə atır -->
    <script>
        if (sessionStorage.getItem("isAdmin") !== "true") {
            window.location.href = "login.html";
        }
    </script>

    <style>
        /* index.html-dən köçürdüyün admin panelə aid CSS stillərini bura yazırsan */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f1f5f9;
            color: #1e293b;
        }
        .admin-header {
            background-color: #1e293b;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logout-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .logout-btn:hover {
            background-color: #dc2626;
        }
        .admin-container {
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <header class="admin-header">
        <h1>Admin İdarəetmə Paneli</h1>
        <button class="logout-btn" onclick="logout()">Çıxış Et</button>
    </header>

    <div class="admin-container">
        <!-- index.html-də olan admin panelin bütün HTML elementlərini bura köçürürsən -->
    </div>

    <script>
        // Çıxış düyməsinin funksiyası
        function logout() {
            sessionStorage.removeItem("isAdmin");
            window.location.href = "login.html";
        }

        // --- İNDEX.HTML-DƏN KÖÇÜRÜLDÜKSTƏN SONRA BÜTÜN JAVASCRIPT FUNKSİYALARIN BURADA OLACAQ ---
        // Məsələn: openPage, renderAdminAnswers, renderAdminGalleryList, renderAdminEventsList və s.

        window.onload = function() {
            // Səhifə açılan kimi işləməli olan render funksiyaların:
            if (typeof renderAdminAnswers === "function") renderAdminAnswers();
            if (typeof renderAdminGalleryList === "function") renderAdminGalleryList();
            if (typeof renderAdminEventsList === "function") renderAdminEventsList();
        }

        // Bütün köhnə admin funksiyalarını bu hissəyə yapışdır:
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Girişi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            color: #f8fafc;
            margin-bottom: 24px;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .input-group label {
            display: block;
            color: #94a3b8;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #3b82f6;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .login-btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Admin Giriş Paneli</h2>
        
        <div class="input-group">
            <label for="username">İstifadəçi adı</label>
            <input type="text" id="username" placeholder="İstifadəçi adınızı daxil edin">
        </div>

        <div class="input-group">
            <label for="password">Şifrə</label>
            <input type="password" id="password" placeholder="Şifrənizi daxil edin">
        </div>

        <button class="login-btn" onclick="checkLogin()">Daxil Ol</button>
    </div>

    <script>
        function checkLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            // İstifadəçi adı və şifrəni buradan dəyişə bilərsən
            if (user === "admin" && pass === "Eldar12345@_*") {
                // Giriş uğurludurse, brauzerdə qeydiyyat saxla və admin səhifəsinə at
                sessionStorage.setItem("isAdmin", "true");
                window.location.href = "admin.html";
            } else {
                alert("İstifadəçi adı və ya şifrə səhvdir!");
            }
        }

        // Enter düyməsinə basanda da giriş etsin deyə əlavə qısayol
        document.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                checkLogin();
            }
        });
    </script>

</body>
</html>
